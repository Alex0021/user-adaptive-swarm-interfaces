[project]
name = "video-sync"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "opencv-python>=4.9",
    "numpy",
    "pandas",
    "PyYaml",
    "workload-inference",
]

[dependency-groups]
dev = [
    "pytest",
    "black",
    "ruff",
]

[project.scripts]
video_sync = "video_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_sync"]

[tool.uv.sources]
workload-inference = { path = "../workload_inference", editable = true }

[tool.black]
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "G"]
